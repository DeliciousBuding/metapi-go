name: CI

# S1: 限 master/PR，避免所有分支全量 11 job
on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Run golangci-lint
        run: golangci-lint run --timeout=3m

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  mod-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go mod download
      - run: go mod verify

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Run gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --source . --no-git --redact --verbose

  docs-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go test ./docs -run TestPublicMarkdownHygiene -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run audit:prod
      - run: npm run typecheck:web
      - run: npm run typecheck:web:test
      - run: npm test
      - run: npm run build:web

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go test ./... -count=1 -race

  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: |
          dsn="${PG_SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}?sslmode=disable"
          PG_TEST_DSN="$dsn" DATABASE_URL="$dsn" go test ./... -count=1 -tags=integration
        env:
          PG_SCHEME: postgres
          PG_USER: postgres
          PG_PASSWORD: test
          PG_DATABASE: metapi_test

  # EN-mode main-surface verification (2026-08-01): boots the real single
  # process (embedded SPA, fresh SQLite) and walks all 11 admin routes
  # asserting no `Untranslated` fallback and no Han residue in EN mode.
  en-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Install web deps
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Build web (embed dist)
        working-directory: web
        run: npm run build:web
      - name: Build server binary
        run: go build -trimpath -o /tmp/metapi-enverify ./cmd/server
      - name: Boot backend + run EN verification
        run: |
          AUTH_TOKEN=ci-en-verify PROXY_TOKEN=sk-ci-verify PORT=4182 DB_URL=/tmp/enverify.db METAPI_ENABLE_PROXY_STUB=1 /tmp/metapi-enverify > /tmp/enverify.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4182/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          cd web
          METAPI_UI_AUTH_TOKEN=ci-en-verify METAPI_UI_SHOT_BASE=http://127.0.0.1:4182 node scripts/verify-en-pages.mjs --with-data
          # zh mode: no Untranslated fallback + known zh labels in place
          # (guards en→zh restore pollution across all 18 routes).
          METAPI_UI_AUTH_TOKEN=ci-en-verify METAPI_UI_SHOT_BASE=http://127.0.0.1:4182 node scripts/verify-en-pages.mjs --with-data --zh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: mkdir -p web/dist
      - run: go build -trimpath ./cmd/server
      - run: go build -trimpath ./cmd/migrate

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - vet
      - vulncheck
      - mod-verify
      - secret-scan
      - docs-hygiene
      - frontend
      - test-sqlite
      - test-pg
      - build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: metapi-go:ci
          load: true
      - name: Smoke Docker image
        run: |
          set -euo pipefail
          name=metapi-ci-smoke
          port=49040
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=ci-admin-token \
            -e PROXY_TOKEN=ci-proxy-token \
            metapi-go:ci

          ready=
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            docker logs "$name"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'
