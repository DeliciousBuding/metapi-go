name: CI/CD

# Single pipeline: every PR and master push runs the full 12-check suite;
# master pushes additionally publish the ghcr.io image (latest + sha); SemVer
# tags (vX.Y.Z) additionally publish multi-platform release binaries + the
# GitHub Release, only after the whole suite and the image push succeeded.
#
# Branch protection requires the 12 test job ids below by name — do NOT rename
# a job here without updating the required status checks on master.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Bun toolchain: every setup-bun step and the
  # Dockerfile bun build stage (BUN_VERSION build-arg) read this value.
  BUN_VERSION: "1.3.14"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/deliciousbuding/metapi-go
  # Shared gha cache scope so docker-push reuses layers built by docker-build.
  DOCKER_CACHE_SCOPE: metapi-go

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      # web/embed.go embeds web/dist, which is gitignored and absent on a
      # fresh checkout. A placeholder file lets Go tooling type-check the
      # embed package; production images build the real SPA in the Dockerfile.
      - run: mkdir -p web/dist && touch web/dist/placeholder.txt
      - name: Run golangci-lint
        run: golangci-lint run --timeout=3m

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # web/embed.go embeds web/dist, which is gitignored and absent on a
      # fresh checkout. A placeholder file lets go vet type-check the embed
      # package; production images build the real SPA in the Dockerfile.
      - run: mkdir -p web/dist && touch web/dist/placeholder.txt
      - run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p web/dist && touch web/dist/placeholder.txt
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  mod-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gitleaks (full git history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --redact --verbose

  docs-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./docs -run TestPublicMarkdownHygiene -count=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip
      - run: bun run test
      - run: bun run build:web
      # The real dist is reused by test-sqlite/test-pg (SPA-fallback tests),
      # instead of each test job rebuilding the frontend.
      - name: Upload web dist for test jobs
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  a11y:
    # axe-core a11y gate against the real production SPA: the Go server embeds
    # web/dist (built by the frontend job) and serves the admin app + API from
    # one origin, so the scan exercises the exact shipped bundle instead of the
    # dev server. Requires a fresh sqlite runtime DB (server auto-migrates).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install web deps (playwright + axe-core)
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: web
      - name: Serve SPA and run axe a11y gate
        run: |
          set -euo pipefail
          AUTH_TOKEN=dev-admin-token-123 \
          PROXY_TOKEN=dev-proxy-token-123 \
          DATA_DIR="$(mktemp -d)/data" \
          PORT=4099 \
          go run ./cmd/server >/tmp/metapi-a11y-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:4099/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "server failed to become ready; log:"
            cat /tmp/metapi-a11y-server.log
            exit 1
          fi
          cd web
          BASE_URL=http://127.0.0.1:4099 bun run a11y:scan

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # built once by the frontend job and passed through the artifact.
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: go test ./... -count=1 -race

  test-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # built once by the frontend job and passed through the artifact.
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: |
          dsn="${PG_SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}?sslmode=disable"
          PG_TEST_DSN="$dsn" DATABASE_URL="$dsn" go test ./... -count=1 -tags=integration -p 1 # -p 1: PG integration shares one database across packages; parallel packages race AutoMigrate/table state
        env:
          PG_SCHEME: postgres
          PG_USER: postgres
          PG_PASSWORD: test
          PG_DATABASE: metapi_test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p web/dist && touch web/dist/placeholder.txt
      - run: go build -trimpath ./cmd/server
      - run: go build -trimpath ./cmd/migrate

  # Build + smoke the image on every run (this is also a required check on PRs).
  # It does not push; docker-push publishes the same image via shared cache.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - lint
      - vet
      - vulncheck
      - mod-verify
      - secret-scan
      - docs-hygiene
      - frontend
      - a11y
      - test-sqlite
      - test-pg
      - build
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: metapi-go:ci
          load: true
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}
      - name: Smoke Docker image
        run: |
          set -euo pipefail
          name=metapi-ci-smoke
          port=49040
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=ci-admin-token \
            -e PROXY_TOKEN=ci-proxy-token \
            metapi-go:ci

          ready=
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            docker logs "$name"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'

  # ---- Publish images: master → latest + sha; SemVer tags → semver tags ----
  docker-push:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [docker-build]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

  # ---- Release: SemVer tags only, after the image is published ----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify release consistency (tag == package.json == CHANGELOG)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./web/package.json').version")"
          if [ "$pkg_ver" != "$ver" ]; then
            echo "web/package.json version ($pkg_ver) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          if ! grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section '## [${GITHUB_REF_NAME}]'" >&2
            exit 1
          fi
          echo "release consistent: $GITHUB_REF_NAME / $pkg_ver"
      - name: Build frontend for release binaries
        working-directory: web
        run: bun install --frozen-lockfile && bun run build:web
      - name: Build multi-platform release binaries
        run: |
          set -euo pipefail
          ldflags="-s -w -X github.com/deliciousbuding/metapi-go/internal/version.Version=${GITHUB_REF_NAME}"
          mkdir -p dist-bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-${os}-${arch}${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-migrate-${os}-${arch}${ext}" ./cmd/migrate
          done
          cd dist-bin
          sha256sum * > checksums.txt
          cd ..
      - name: Smoke linux-amd64 release binary
        run: |
          set -euo pipefail
          ./dist-bin/metapi-linux-amd64 --version | grep -Fx "$GITHUB_REF_NAME"
          ./dist-bin/metapi-linux-amd64 --help >/dev/null
      - name: Extract changelog section for this tag
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "no changelog section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-bin/* --clobber
            gh release edit "$tag" --notes-file release-body.md
          else
            gh release create "$tag" dist-bin/* --title "$tag" --notes-file release-body.md --latest
          fi
