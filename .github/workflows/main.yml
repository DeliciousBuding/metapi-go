name: CI/CD

# Single pipeline: every PR and master push runs the full 12-check suite;
# master pushes additionally publish the ghcr.io image (latest + sha); SemVer
# tags (vX.Y.Z) additionally publish multi-platform release binaries + the
# GitHub Release, only after the whole suite and the image push succeeded.
#
# Branch protection requires the 12 test job ids below by name — do NOT rename
# a job here without updating the required status checks on master.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Bun toolchain: every setup-bun step and the
  # Dockerfile bun build stage (BUN_VERSION build-arg) read this value.
  BUN_VERSION: "1.3.14"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/deliciousbuding/metapi-go
  # Shared gha cache scope so docker-push reuses layers built by docker-build.
  DOCKER_CACHE_SCOPE: metapi-go

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-toolchain
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # goinstall builds with the current toolchain (go.mod go directive is
          # newer than the action's prebuilt binary), and still caches the build.
          install-mode: goinstall
          args: --timeout=3m

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-toolchain
      - run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-toolchain
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  mod-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run gitleaks (full git history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --redact --verbose

  docs-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./docs -run TestPublicMarkdownHygiene -count=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip
      - run: bun run test
      - run: bun run build:web
      # The real dist is reused by test-sqlite/test-pg (SPA-fallback tests),
      # instead of each test job rebuilding the frontend.
      - name: Upload web dist for test jobs
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  a11y:
    # Real-browser production-SPA gates: axe accessibility + route/crash/mobile
    # smoke. The Go server embeds web/dist (built by the frontend job) and serves
    # the admin app + API from one origin, so these exercise the exact shipped
    # bundle instead of the dev server. Requires a fresh sqlite runtime DB.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Install web deps (playwright + axe-core)
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lockb') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: web
      - name: Serve SPA and run browser gates
        run: |
          set -euo pipefail
          AUTH_TOKEN=dev-admin-token-123 \
          PROXY_TOKEN=dev-proxy-token-123 \
          DATA_DIR="$(mktemp -d)/data" \
          PORT=4099 \
          go run ./cmd/server >/tmp/metapi-a11y-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:4099/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "server failed to become ready; log:"
            cat /tmp/metapi-a11y-server.log
            exit 1
          fi
          cd web
          BASE_URL=http://127.0.0.1:4099 bun run a11y:scan
          BASE_URL=http://127.0.0.1:4099 AUTH_TOKEN=dev-admin-token-123 bun run ui:smoke

  test-sqlite-shard:
    # The race detector makes the full suite the pipeline's long pole (~5 min).
    # Shard packages round-robin across parallel runners to cut it ~4x while
    # still running every package under -race. (Packages are independent; the
    # handler tests use per-test :memory: sqlite, so sharding is safe.) The
    # stable `test-sqlite` name below aggregates the shards so branch
    # protection keeps a single required check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-toolchain
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # built once by the frontend job and passed through the artifact.
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./...)
          shard_pkgs=()
          for i in "${!pkgs[@]}"; do
            if (( i % matrix.total == matrix.shard )); then
              shard_pkgs+=("${pkgs[i]}")
            fi
          done
          if [ "${#shard_pkgs[@]}" -eq 0 ]; then
            echo "no packages in shard; nothing to run"
            exit 0
          fi
          echo "shard ${{ matrix.shard }} running ${#shard_pkgs[@]} packages:"
          printf '  %s\n' "${shard_pkgs[@]}"
          go test "${shard_pkgs[@]}" -count=1 -race

  # Stable name that branch protection depends on: passes only when every
  # shard above passed.
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-sqlite-shard
    steps:
      - run: echo "all test-sqlite shards passed"

  test-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # built once by the frontend job and passed through the artifact.
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: |
          dsn="${PG_SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}?sslmode=disable"
          PG_TEST_DSN="$dsn" DATABASE_URL="$dsn" go test ./... -count=1 -tags=integration -p 1 # -p 1: PG integration shares one database across packages; parallel packages race AutoMigrate/table state
        env:
          PG_SCHEME: postgres
          PG_USER: postgres
          PG_PASSWORD: test
          PG_DATABASE: metapi_test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-toolchain
      - run: go build -trimpath ./cmd/server
      - run: go build -trimpath ./cmd/migrate

  # Real-platform e2e: boots REAL upstreams (new-api v1, one-api) as service
  # containers, starts a live metapi server on the runner, and drives
  # scripts/e2e/smoke.sh through the full admin + proxy chain (detect → login →
  # verify → account → models → balance → checkin → downstream token → route →
  # /v1 relay). This is the durable, free-on-Actions version of the transient
  # ARM testbed: no external infra, no secrets, re-runnable per push.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      new-api:
        image: calciumion/new-api:latest
        ports:
          - 3000:3000
      one-api:
        image: justsong/one-api:latest
        ports:
          - 3001:3000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-toolchain
      - name: Initialize upstreams
        run: |
          set -euo pipefail
          # new-api v1 has no default password: first-run setup creates root.
          for i in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:3000/api/setup \
              -H 'Content-Type: application/json' \
              -d '{"username":"root","password":"metapi123","confirmPassword":"metapi123","SelfUseModeEnabled":false,"DemoSiteEnabled":false}' >/dev/null 2>&1; then
              echo "new-api initialized"
              break
            fi
            sleep 2
          done
          # one-api auto-seeds root/123456; just wait for readiness.
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/status >/dev/null 2>&1 && { echo "one-api ready"; break; }
            sleep 2
          done
      - name: Run live server + smoke chains
        run: |
          set -euo pipefail
          AUTH_TOKEN=e2e-admin-token \
          PROXY_TOKEN=e2e-proxy-token \
          DATA_DIR="$(mktemp -d)/data" \
          PORT=4010 \
          go run ./cmd/server >/tmp/metapi-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4010/ready 2>/dev/null | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "metapi server failed to become ready; log:"
            cat /tmp/metapi-e2e.log
            exit 1
          fi

          echo "===== new-api full chain ====="
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3000 \
          UPSTREAM_USERNAME=root UPSTREAM_PASSWORD=metapi123 \
          PLATFORM=new-api \
          bash scripts/e2e/smoke.sh

          echo "===== one-api full chain ====="
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3001 \
          UPSTREAM_USERNAME=root UPSTREAM_PASSWORD=123456 \
          PLATFORM=one-api SITE_NAME=e2e-smoke-oneapi TOKEN_NAME=e2e-smoke-oneapi-token \
          bash scripts/e2e/smoke.sh

  # Build + smoke the image on every run (this is also a required check on PRs).
  # It does not push; docker-push publishes the same image via shared cache.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - lint
      - vet
      - vulncheck
      - mod-verify
      - secret-scan
      - docs-hygiene
      - frontend
      - a11y
      - test-sqlite
      - test-pg
      - build
      - test-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: metapi-go:ci
          load: true
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}
      - name: Smoke Docker image
        run: |
          set -euo pipefail
          name=metapi-ci-smoke
          port=49040
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=ci-admin-token \
            -e PROXY_TOKEN=ci-proxy-token \
            metapi-go:ci

          ready=
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            docker logs "$name"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'

  # ---- Publish images: master → latest + sha; SemVer tags → semver tags ----
  docker-push:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [docker-build]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

  # ---- Release: SemVer tags only, after the image is published ----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify release consistency (tag == package.json == CHANGELOG)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./web/package.json').version")"
          if [ "$pkg_ver" != "$ver" ]; then
            echo "web/package.json version ($pkg_ver) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          if ! grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section '## [${GITHUB_REF_NAME}]'" >&2
            exit 1
          fi
          echo "release consistent: $GITHUB_REF_NAME / $pkg_ver"
      - name: Build frontend for release binaries
        working-directory: web
        run: bun install --frozen-lockfile && bun run build:web
      - name: Build multi-platform release binaries
        run: |
          set -euo pipefail
          ldflags="-s -w -X github.com/deliciousbuding/metapi-go/internal/version.Version=${GITHUB_REF_NAME}"
          mkdir -p dist-bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-${os}-${arch}${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-migrate-${os}-${arch}${ext}" ./cmd/migrate
          done
          cd dist-bin
          sha256sum * > checksums.txt
          cd ..
      - name: Smoke linux-amd64 release binary
        run: |
          set -euo pipefail
          ./dist-bin/metapi-linux-amd64 --version | grep -Fx "$GITHUB_REF_NAME"
          ./dist-bin/metapi-linux-amd64 --help >/dev/null
      - name: Extract changelog section for this tag
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "no changelog section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # install.sh must ship as a release asset so the documented
          # curl .../download/install.sh | bash flow resolves.
          cp scripts/install.sh dist-bin/install.sh
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-bin/* --clobber
            gh release edit "$tag" --notes-file release-body.md
          else
            gh release create "$tag" dist-bin/* --title "$tag" --notes-file release-body.md --latest
          fi
