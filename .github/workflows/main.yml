name: CI/CD

# Protected static checks, edge publication and SemVer release packaging.
# Full integration and image build/smoke run in nightly.yml.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A tag run publishes images and creates a Release. Cancelling it midway can
  # leave a partially published tag set, so only branch/PR runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Single source of truth for the Bun toolchain: every setup-bun step and the
  # Dockerfile bun build stage (BUN_VERSION + BUN_DIGEST build-args) read this
  # value. Bump both together; scripts/bun_install_wiring_test.go enforces it.
  BUN_VERSION: "1.4.4"
  BUN_DIGEST: "sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a"
  NODE_VERSION: "26.13.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/deliciousbuding/metapi-go
  # Per-architecture gha cache scopes keep native amd64/arm64 builds from
  # evicting each other; docker-build reuses the amd64 scope.
  DOCKER_CACHE_SCOPE: metapi-go

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      modules: ${{ steps.plan.outputs.modules }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      packages: ${{ steps.plan.outputs.packages }}
      lintPackages: ${{ steps.plan.outputs.lintPackages }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-toolchain
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          echo "started=$(date -d "$created" +%s)" >> "$GITHUB_OUTPUT"
          mode=change
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=$(git hash-object -t tree /dev/null); fi
          args=(-base "$BASE" -head "$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mode=release
            bash scripts/require-main-validation.sh "$GITHUB_SHA"
          fi
          plan=$(go run scripts/ci-plan.go -mode "$mode" "${args[@]}")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          for key in backend frontend modules packages lintPackages; do
            echo "$key=$(jq -c ".$key" <<< "$plan")" >> "$GITHUB_OUTPUT"
          done
          {
            echo '## Verification plan'
            echo 'PR and master static checks target 120 seconds.'
            echo '~~~json'
            jq . <<< "$plan"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    env:
      GOLANGCI_LINT_VERSION: "v2.15.0"
    if: ${{ needs.scope.outputs.backend == 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: gofmt check (pinned to the go.mod toolchain)
        # gofmt's opinion changes between Go releases (e.g. 1.26 struct-literal
        # alignment), so the gate runs on the go.mod toolchain — the same
        # version local devs get from `go env`. Only tracked files are listed,
        # which keeps gitignored evidence dirs out of scope.
        run: |
          set -euo pipefail
          git ls-files -z -- '*.go' > "$RUNNER_TEMP/go-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/go-files"
          [[ ${#files[@]} -gt 0 ]] || { echo 'empty format scan' >&2; exit 1; }
          out="$(gofmt -l "${files[@]}")"
          if [ -n "$out" ]; then
            echo "gofmt drift in these files:"
            echo "$out"
            exit 1
          fi
      - name: Validate deployment Compose file
        # The template must resolve with its own example values: a new required
        # variable that is missing from .env.example fails here, before a user
        # copies it into production.
        run: docker compose --env-file .env.example config --quiet
      - id: lint-toolchain
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Cache pinned golangci-lint binary
        id: lint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/lint-bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.lint-toolchain.outputs.version }}-${{ env.GOLANGCI_LINT_VERSION }}
      - name: Install pinned golangci-lint
        if: steps.lint-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/lint-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
      - run: echo "$RUNNER_TEMP/lint-bin" >> "$GITHUB_PATH"
      # The pinned v2 binary embeds its matching configuration schema.
      - name: Verify golangci-lint config and rejection behavior
        shell: bash
        run: |
          set -euo pipefail
          bad_config="$RUNNER_TEMP/golangci.bad.yml"
          printf 'version: "2"\nlinters:\n  invalid-property: true\n' > "$bad_config"
          if golangci-lint config verify --config "$bad_config" \
            > "$RUNNER_TEMP/golangci.bad.log" 2>&1; then
            echo "invalid config unexpectedly passed"
            cat "$RUNNER_TEMP/golangci.bad.log"
            exit 1
          fi
          golangci-lint config verify
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: none
          verify: false
          args: --timeout=3m ${{ join(fromJSON(needs.scope.outputs.lintPackages), ' ') }}

  vet-platform:
    if: ${{ needs.scope.outputs.backend == 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - env:
          GOOS: ${{ matrix.goos }}
          SELECTED_PACKAGES: ${{ needs.scope.outputs.packages }}
        run: |
          set -euo pipefail
          jq -er '.[]' <<< "$SELECTED_PACKAGES" > "$RUNNER_TEMP/vet-packages"
          mapfile -t packages < "$RUNNER_TEMP/vet-packages"
          [[ ${#packages[@]} -gt 0 ]]
          go vet "${packages[@]}"

  vet:
    if: ${{ !cancelled() && needs.scope.outputs.backend == 'true' }}
    needs: [scope, vet-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLATFORMS: ${{ needs.vet-platform.result }}
        run: test "$PLATFORMS" = success

  vulncheck:
    if: ${{ needs.scope.outputs.modules == 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  mod-verify:
    if: ${{ needs.scope.outputs.modules == 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify

  secret-scan:
    if: ${{ needs.scope.outputs.plan != '' && fromJSON(needs.scope.outputs.plan).mode != 'release' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run gitleaks (PR commit range; full history on master)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then args=(--log-opts="$BASE..$GITHUB_SHA"); fi
          go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --redact --verbose "${args[@]}"

  docs-hygiene:
    if: ${{ needs.scope.outputs.plan != '' && fromJSON(needs.scope.outputs.plan).mode != 'release' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Repository hygiene gates (Markdown, programme codes, tracked file size)
        run: go test ./docs -count=1

  frontend:
    if: ${{ needs.scope.outputs.frontend == 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Cache downloads only, never node_modules; every job still performs the
      # same frozen-lockfile install through the shared retry policy.
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
      # Never call `bun install` directly: scripts/bun-install.sh carries the
      # transient-fault retry policy, and scripts/bun_install_wiring_test.go
      # fails if a bare call reappears.
      - run: sh ../scripts/bun-install.sh
      - name: Frontend static and contract checks
        run: |
          set -euo pipefail
          bun run check:static
          bun run routes:verify
          node --test scripts/__tests__/*.test.mjs
          bunx vitest run src/i18n/__tests__/i18n-keys.test.ts src/styles/__tests__/

  web-dist:
    if: ${{ needs.scope.outputs.backend == 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
      - run: sh ../scripts/bun-install.sh
        working-directory: web
      - run: bun run build:web
        working-directory: web
      - name: Upload web dist for test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  a11y:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1  # Implemented by nightly.yml; an accidental invocation must fail.

  test-sqlite:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1  # Implemented by nightly.yml; an accidental invocation must fail.

  test-pg:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1  # Implemented by nightly.yml; an accidental invocation must fail.

  build:
    if: ${{ needs.scope.outputs.backend == 'true' }}
    needs: [scope, web-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: go build -trimpath ./cmd/server ./cmd/migrate

  test-e2e:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1  # Implemented by nightly.yml; an accidental invocation must fail.

  runtime-smoke-matrix:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1  # Implemented by nightly.yml; an accidental invocation must fail.

  docker-build:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - scope
      - lint
      - vet
      - vulncheck
      - mod-verify
      - secret-scan
      - docs-hygiene
      - frontend
      - web-dist
      - a11y
      - test-sqlite
      - test-pg
      - build
      - test-e2e
      - runtime-smoke-matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: Require exactly the planned prerequisites
        env:
          PLAN_JSON: ${{ needs.scope.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: go run scripts/ci-plan.go -verify-needs
      - name: PR latency budget
        if: github.event_name == 'pull_request'
        env:
          STARTED: ${{ needs.scope.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          echo "PR end-to-end elapsed: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 120 )); then
            echo "::warning::PR exceeded the 120s target (${elapsed}s). Optimize work; do not drop required coverage."
          fi

  docker-prepare:
    if: ${{ !cancelled() && needs.docker-build.result == 'success' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build]
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Resolve tags and refuse to overwrite a released version
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            plain="${version#v}"
            major="${plain%%.*}"
            rest="${plain#*.}"
            minor="${rest%%.*}"
            tags=("$version" "$plain" "${major}.${minor}" "latest")

            # A released version tag is an immutable identity. Re-running a
            # failed publication must use a new patch version, not silently
            # replace bytes that downstream deployments may have pinned.
            registry_path="${IMAGE_NAME#ghcr.io/}"
            token="$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              "https://ghcr.io/token?scope=repository:${registry_path}:pull" | jq -r '.token')"
            if [[ -z "$token" || "$token" == "null" ]]; then
              echo "::error::GHCR did not issue an anonymous pull token"
              exit 1
            fi
            for existing in "$version" "$plain"; do
              code="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors \
                -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${registry_path}/manifests/${existing}")"
              case "$code" in
                404) ;;
                200)
                  echo "::error::release image ${IMAGE_NAME}:${existing} already exists; published version tags are immutable. Bump the patch version."
                  exit 1
                  ;;
                *)
                  echo "::error::could not determine whether ${IMAGE_NAME}:${existing} exists (HTTP ${code})"
                  exit 1
                  ;;
              esac
            done
          else
            version=dev
            tags=("edge" "sha-${GITHUB_SHA:0:7}")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Image publication"
            echo
            echo "- version: \`${version}\`"
            echo "- tags: \`$(printf '%s ' "${tags[@]}")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-push:
    if: ${{ !cancelled() && needs.docker-prepare.result == 'success' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [docker-prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve build provenance
        id: provenance
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          # buildx requires a tag when pushing. This pointer is internal: the
          # manifest job merges the per-architecture digests, so a concurrent
          # run overwriting the tag cannot mix architectures.
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.docker-prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.provenance.outputs.build_time }}
            BUN_VERSION=${{ env.BUN_VERSION }}
            BUN_DIGEST=${{ env.BUN_DIGEST }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign per-architecture image
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Record per-architecture digest
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          printf '%s' "${{ steps.build.outputs.digest }}" > "${RUNNER_TEMP}/${ARCH}.txt"
          {
            echo "### ${IMAGE_NAME} ${ARCH} (${PLATFORM})"
            echo '```text'
            echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload architecture digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.txt
          if-no-files-found: error

  docker-manifest:
    if: ${{ !cancelled() && needs.docker-prepare.result == 'success' && needs.docker-push.result == 'success' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [docker-prepare, docker-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download architecture digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true
      - name: Create and verify multi-arch manifests
        id: manifest
        shell: bash
        env:
          BASE_TAGS: ${{ needs.docker-prepare.outputs.tags }}
        run: |
          set -euo pipefail
          amd64="$(cat "${RUNNER_TEMP}/image-digests/amd64.txt")"
          arm64="$(cat "${RUNNER_TEMP}/image-digests/arm64.txt")"
          for value in "$amd64" "$arm64"; do
            if [[ ! "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::architecture digest is missing or malformed: ${value}"
              exit 1
            fi
          done
          digest=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            ref="${IMAGE_NAME}:${tag}"
            # Merge exactly the digests this run built; floating tag names could
            # mix architectures when two releases publish concurrently.
            docker buildx imagetools create -t "$ref" \
              "${IMAGE_NAME}@${amd64}" "${IMAGE_NAME}@${arm64}"
            inspect="$(docker buildx imagetools inspect "$ref")"
            printf '%s\n' "$inspect"
            for platform in linux/amd64 linux/arm64; do
              if ! grep -Eq "Platform:[[:space:]]+${platform}" <<< "$inspect"; then
                echo "::error::${ref} is missing ${platform}"
                exit 1
              fi
            done
            if ! grep -Eq 'Platform:[[:space:]]+unknown/unknown' <<< "$inspect"; then
              echo "::error::${ref} lost the build provenance attestation"
              exit 1
            fi
            tag_digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
            if [[ -z "$tag_digest" ]]; then
              echo "::error::could not read the manifest digest for ${ref}"
              exit 1
            fi
            if [[ -z "$digest" ]]; then digest="$tag_digest"; fi
            if [[ "$tag_digest" != "$digest" ]]; then
              echo "::error::${ref} resolved to ${tag_digest}, expected ${digest}"
              exit 1
            fi
          done <<< "$BASE_TAGS"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Multi-arch manifest"
            echo '```text'
            echo "${IMAGE_NAME}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign multi-arch manifest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.manifest.outputs.digest }}"

  image-verify:
    if: ${{ !cancelled() && needs.docker-prepare.result == 'success' && needs.docker-manifest.result == 'success' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [docker-prepare, docker-manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Pull anonymously and smoke the published image
        shell: bash
        env:
          BASE_TAGS: ${{ needs.docker-prepare.outputs.tags }}
          EXPECTED_VERSION: ${{ needs.docker-prepare.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.docker-manifest.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          first_tag="$(printf '%s\n' "$BASE_TAGS" | head -n 1)"
          ref="${IMAGE_NAME}:${first_tag}"
          pulled=
          for attempt in 1 2 3; do
            if docker pull "$ref"; then pulled=1; break; fi
            echo "pull attempt ${attempt} failed; retrying"
            sleep 5
          done
          if [[ -z "$pulled" ]]; then
            echo "::error::anonymous pull of ${ref} failed after 3 attempts"
            exit 1
          fi
          # GHCR/buildx occasionally answers with a transient 5xx/timeout even
          # though the pull succeeded; retry so a registry hiccup does not fail
          # an otherwise verified publication.
          resolved=
          for attempt in 1 2 3; do
            if inspect_out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
              resolved="$(printf '%s\n' "$inspect_out" | awk '/^Digest:/ {print $2; exit}')"
              break
            fi
            echo "imagetools inspect attempt ${attempt} failed: ${inspect_out}"
            sleep 5
          done
          if [[ -z "$resolved" ]]; then
            echo "::error::could not resolve ${ref} after 3 attempts"
            exit 1
          fi
          if [[ "$resolved" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::${ref} resolved to ${resolved}, expected ${EXPECTED_DIGEST}"
            exit 1
          fi
          actual_arch="$(docker image inspect "$ref" --format '{{.Architecture}}')"
          if [[ "$actual_arch" != "$ARCH" ]]; then
            echo "::error::${ref} pulled ${actual_arch} on the ${ARCH} runner"
            exit 1
          fi
          name="metapi-verify-${ARCH}"
          port=49041
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=verify-admin-token \
            -e PROXY_TOKEN=verify-proxy-token \
            -e ACCOUNT_CREDENTIAL_SECRET=verify-credential-secret-0123456789abcdef \
            "$ref"
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/ready" 2>/dev/null | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$ready" ]]; then
            docker logs "$name"
            exit 1
          fi
          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'
          about="$(curl -fsS -H 'Authorization: Bearer verify-admin-token' \
            "http://127.0.0.1:${port}/api/about")"
          printf '%s\n' "$about"
          printf '%s' "$about" | jq -e --arg v "$EXPECTED_VERSION" '.version == $v' >/dev/null
          echo "verified ${ref} on ${ARCH} (version ${EXPECTED_VERSION})"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: matrix.arch == 'amd64'
      - name: Verify the published signature
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          BASE_TAGS: ${{ needs.docker-prepare.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "$BASE_TAGS" | head -n 1)"
          cosign verify "${IMAGE_NAME}:${first_tag}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/main.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  release:
    if: ${{ !cancelled() && needs.image-verify.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [image-verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify release consistency (tag == package.json == CHANGELOG)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./web/package.json').version")"
          if [ "$pkg_ver" != "$ver" ]; then
            echo "web/package.json version ($pkg_ver) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          if ! grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section '## [${GITHUB_REF_NAME}]'" >&2
            exit 1
          fi
          echo "release consistent: $GITHUB_REF_NAME / $pkg_ver"
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
      - name: Install web deps for release binaries
        run: sh ../scripts/bun-install.sh
        working-directory: web
      - name: Build frontend for release binaries
        working-directory: web
        run: bun run build:web
      - name: Build multi-platform release binaries
        run: |
          set -euo pipefail
          version_pkg="github.com/deliciousbuding/metapi-go/internal/version"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X ${version_pkg}.Version=${GITHUB_REF_NAME} -X ${version_pkg}.Commit=${GITHUB_SHA} -X ${version_pkg}.BuildTime=${build_time}"
          mkdir -p dist-bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-${os}-${arch}${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-migrate-${os}-${arch}${ext}" ./cmd/migrate
          done
          cd dist-bin
          sha256sum * > checksums.txt
          cd ..
      - name: Smoke linux-amd64 release binary
        run: |
          set -euo pipefail
          ./dist-bin/metapi-linux-amd64 --version | grep -Fx "$GITHUB_REF_NAME"
          ./dist-bin/metapi-linux-amd64 --help >/dev/null
      - name: Extract changelog section for this tag
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "no changelog section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Reject internal information in public release notes
        run: |
          set -euo pipefail
          # Public release notes are user-facing change logs, not internal work
          # reports. Ban internal governance vocabulary, test-coverage numbers
          # and generic internal path shapes. NOTE: no concrete hostnames or
          # config keys belong in this file (it is public) — specific leaks are
          # caught by the draft + human review gate instead.
          forbidden='真实上游|运行时矩阵|2/16|4/16|1/5|4/5|golden|截图管道|Playwright|vitest|审计波|并行线|0\.0\.0\.0/8|/root/|/home/|/tmp/|C:/|D:\\|Wave [0-9]|Round [0-9]'
          if grep -nE "$forbidden" release-body.md; then
            echo "release notes contain internal information (see matches above)" >&2
            exit 1
          fi
          echo "release notes hygiene: clean"
      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # install.sh must ship as a release asset so the documented
          # curl .../download/install.sh | bash flow resolves.
          cp scripts/install.sh dist-bin/install.sh
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-bin/* --clobber
            gh release edit "$tag" --notes-file release-body.md
          else
            # Draft by policy: tag push builds and uploads everything, but the
            # release stays hidden until a human reviews the notes (internal
            # information must never auto-publish) and publishes it.
            gh release create "$tag" dist-bin/* --title "$tag" --notes-file release-body.md --draft
          fi
