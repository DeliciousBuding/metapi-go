name: CI/CD

# Single pipeline: every PR and master push runs the full 12-check suite;
# master pushes additionally publish the ghcr.io image (edge + sha); SemVer
# tags (vX.Y.Z) publish release tags, move latest, and add multi-platform
# release binaries + the GitHub Release after the suite and image push succeed.
#
# Branch protection requires the 12 test job ids below by name — do NOT rename
# a job here without updating the required status checks on master.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A tag run publishes images and creates a Release. Cancelling it midway can
  # leave a partially published tag set, so only branch/PR runs are cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Single source of truth for the Bun toolchain: every setup-bun step and the
  # Dockerfile bun build stage (BUN_VERSION + BUN_DIGEST build-args) read this
  # value. Bump both together; scripts/bun_install_wiring_test.go enforces it.
  BUN_VERSION: "1.3.14"
  BUN_DIGEST: "sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/deliciousbuding/metapi-go
  # Per-architecture gha cache scopes keep native amd64/arm64 builds from
  # evicting each other; docker-build reuses the amd64 scope.
  DOCKER_CACHE_SCOPE: metapi-go

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: gofmt check (pinned to the go.mod toolchain)
        # gofmt's opinion changes between Go releases (e.g. 1.26 struct-literal
        # alignment), so the gate runs on the go.mod toolchain — the same
        # version local devs get from `go env`. Only tracked files are listed,
        # which keeps gitignored evidence dirs out of scope.
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then
            echo "gofmt drift in these files:"
            echo "$out"
            exit 1
          fi
      - name: Validate deployment Compose file
        # The template must resolve with its own example values: a new required
        # variable that is missing from .env.example fails here, before a user
        # copies it into production.
        run: docker compose --env-file .env.example config --quiet
      - name: Install pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # golangci-lint-action's implicit config verify uses a 2s HTTP timeout
      # with no retry. Verify the same config explicitly against a hash-pinned
      # schema, then let the action focus on source linting.
      - name: Verify golangci-lint config against pinned schema
        shell: bash
        env:
          GOLANGCI_SCHEMA_URL: https://golangci-lint.run/jsonschema/golangci.v1.64.jsonschema.json
          GOLANGCI_SCHEMA_SHA256: 10b70078efef8ba3e529b3c200241661471e85d8e8b38fa898c50c56f6409bad
        run: |
          set -euo pipefail
          schema="$RUNNER_TEMP/golangci.v1.64.jsonschema.json"
          curl --fail --show-error --location \
            --retry 5 --retry-delay 2 --retry-max-time 60 \
            --connect-timeout 10 --max-time 20 \
            "$GOLANGCI_SCHEMA_URL" -o "$schema"
          printf '%s  %s\n' "$GOLANGCI_SCHEMA_SHA256" "$schema" | sha256sum --check

          bad_config="$RUNNER_TEMP/golangci.bad.yml"
          printf 'linters:\n  invalid-property: true\n' > "$bad_config"
          if golangci-lint config verify --config "$bad_config" --schema "$schema" \
            > "$RUNNER_TEMP/golangci.bad.log" 2>&1; then
            echo "invalid config unexpectedly passed"
            cat "$RUNNER_TEMP/golangci.bad.log"
            exit 1
          fi

          golangci-lint config verify --schema "$schema"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d6c05c543676670c2115a45b24210890aede0f83 # v6.4.0
        with:
          version: v1.64.8
          install-mode: none
          verify: false
          args: --timeout=3m

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  mod-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go mod verify

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run gitleaks (full git history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --redact --verbose

  docs-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prose hygiene gates (public markdown + programme codes in sources)
        run: go test ./docs -run 'Hygiene|ProgrammeCode' -count=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Never call `bun install` directly: scripts/bun-install.sh carries the
      # transient-fault retry policy, and scripts/bun_install_wiring_test.go
      # fails if a bare call reappears.
      - run: sh ../scripts/bun-install.sh
      - run: bun run check

  # Build the bundle independently: Go and browser checks need its bytes, not
  # the frontend lint/test job's completion. docker-build still requires both.
  web-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: sh ../scripts/bun-install.sh
        working-directory: web
      - run: bun run build:web
        working-directory: web
      - name: Upload web dist for test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  a11y:
    # Real-browser production-SPA gates: axe accessibility + route/crash/mobile
    # smoke. The Go server embeds web/dist (built by web-dist) and serves
    # the admin app + API from one origin, so these exercise the exact shipped
    # bundle instead of the dev server. Requires a fresh sqlite runtime DB.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web-dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Install web deps (playwright + axe-core)
        run: sh ../scripts/bun-install.sh
        working-directory: web
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: web
      - name: Serve SPA and run browser gates
        run: |
          set -euo pipefail
          AUTH_TOKEN=dev-admin-token-123 \
          PROXY_TOKEN=dev-proxy-token-123 \
          DATA_DIR="$(mktemp -d)/data" \
          PORT=4099 \
          go run ./cmd/server >/tmp/metapi-a11y-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:4099/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "server failed to become ready; log:"
            cat /tmp/metapi-a11y-server.log
            exit 1
          fi
          cd web
          BASE_URL=http://127.0.0.1:4099 bun run a11y:scan
          BASE_URL=http://127.0.0.1:4099 AUTH_TOKEN=dev-admin-token-123 bun run ui:smoke
          BASE_URL=http://127.0.0.1:4099 AUTH_TOKEN=dev-admin-token-123 bunx playwright test --config playwright.visual.config.mjs catalog-sources-responsive.spec.mjs model-playground.spec.mjs

  test-sqlite-shard:
    # The race detector makes the full suite the pipeline's long pole (~5 min).
    # Shard packages round-robin across parallel runners to cut it ~4x while
    # still running every package under -race. (Packages are independent; the
    # handler tests use per-test :memory: sqlite, so sharding is safe.) The
    # stable `test-sqlite` name below aggregates the shards so branch
    # protection keeps a single required check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web-dist
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # built once by web-dist and passed through the artifact.
      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          # The matrix values are bound to the environment rather than inlined
          # into the script body. Inlined as bare `matrix.total`, the arithmetic
          # below became a bash syntax error; because it sat in an `if`
          # condition it was exempt from `set -e`, so every package was skipped,
          # the "no packages in shard" branch exited 0, and all four shards
          # reported success while running zero tests. `set -u` plus the guards
          # below make any recurrence loud instead of green.
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.total }}
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./...)
          if [ "${#pkgs[@]}" -lt "$SHARD_TOTAL" ]; then
            echo "ERROR: go list returned ${#pkgs[@]} package(s), fewer than the $SHARD_TOTAL shards"
            exit 1
          fi
          shard_pkgs=()
          for i in "${!pkgs[@]}"; do
            # Standalone assignment, not an `if (( ... ))` condition: a broken
            # selector aborts the step under set -e instead of being swallowed.
            slot=$(( i % SHARD_TOTAL ))
            if [ "$slot" -eq "$SHARD" ]; then
              shard_pkgs+=("${pkgs[i]}")
            fi
          done
          # Round-robin over N packages into T shards owes shard S exactly
          # ceil((N - S) / T) of them. Asserting the number catches a selector
          # that quietly picks too few, not only one that picks none.
          want=$(( ( ${#pkgs[@]} - SHARD + SHARD_TOTAL - 1 ) / SHARD_TOTAL ))
          if [ "${#shard_pkgs[@]}" -ne "$want" ]; then
            echo "ERROR: shard $SHARD/$SHARD_TOTAL selected ${#shard_pkgs[@]} package(s); round-robin over ${#pkgs[@]} requires $want"
            exit 1
          fi
          if [ "${#shard_pkgs[@]}" -eq 0 ]; then
            echo "ERROR: shard $SHARD/$SHARD_TOTAL selected no packages; refusing to report green"
            exit 1
          fi
          echo "shard $SHARD/$SHARD_TOTAL running ${#shard_pkgs[@]} of ${#pkgs[@]} packages:"
          printf '  %s\n' "${shard_pkgs[@]}"
          go test "${shard_pkgs[@]}" -count=1 -race

  # Stable name that branch protection depends on: passes only when every
  # shard above passed.
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-sqlite-shard
    steps:
      - run: echo "all test-sqlite shards passed"

  test-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: web-dist
    env:
      PG_SCHEME: postgres
      PG_USER: postgres
      PG_PASSWORD: test
      PG_DATABASE: metapi_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # built once by web-dist and passed through the artifact.
      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: |
          dsn="${PG_SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}?sslmode=disable"
          PG_TEST_DSN="$dsn" DATABASE_URL="$dsn" go test ./... -count=1 -tags=integration -p 1 # -p 1: PG integration shares one database across packages; parallel packages race AutoMigrate/table state
      - name: PostgreSQL server process E2E
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
          go build -trimpath -o "$RUNNER_TEMP/metapi-pg-e2e" ./cmd/server
          dsn="${PG_SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}?sslmode=disable"
          PG_TEST_DSN="$dsn" bash scripts/e2e/postgres-process.sh "$RUNNER_TEMP/metapi-pg-e2e"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - run: go build -trimpath ./cmd/server
      - run: go build -trimpath ./cmd/migrate

  # Real-platform e2e: boots REAL upstreams as service containers — new-api v1
  # and one-api (password-login chains via scripts/e2e/smoke.sh) plus sub2api
  # and cliproxyapi (token-import chains via scripts/e2e/verify-token-import.sh)
  # — starts a live metapi server on the runner, and drives the full admin +
  # proxy chain (detect → login/verify → account → models → balance → checkin →
  # downstream token → route → /v1 relay). This is the durable, free-on-Actions
  # version of the transient ARM testbed: no external infra, no secrets,
  # re-runnable per push.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      new-api:
        # v1.0.0-rc.39 (2026-09-20): released before the last green E2E run;
        # the later upstream release removed the dashboard PAT endpoint used
        # by this chain. Pin this fixture until the adapter is migrated.
        image: calciumion/new-api@sha256:219b0cecfd7d1aaeacc1d1d0f4bf51615b64260ac1fe73b89937efa469a6d57f
        ports:
          - 3000:3000
      one-api:
        image: justsong/one-api:latest
        ports:
          - 3001:3000
      # sub2api first-run needs postgres + redis (AUTO_SETUP migrates the DB and
      # creates the admin account); cliproxyapi bootstraps its config store from
      # the same postgres (PGSTORE_DSN -> /CLIProxyAPI/config.example.yaml inside
      # the image). Service containers of one job share a docker network, so
      # sub2api/cliproxyapi reach PG/Redis by service hostname (postgres/redis)
      # while the job steps themselves reach everything via localhost ports.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sub2api
          POSTGRES_PASSWORD: sub2api-test-pw
          POSTGRES_DB: sub2api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      sub2api:
        image: weishaw/sub2api:latest
        ports:
          - "3004:8080"
        env:
          AUTO_SETUP: "true"
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: "8080"
          SERVER_MODE: release
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
          DATABASE_USER: sub2api
          DATABASE_PASSWORD: sub2api-test-pw
          DATABASE_DBNAME: sub2api
          DATABASE_SSLMODE: disable
          REDIS_HOST: redis
          REDIS_PORT: "6379"
          ADMIN_EMAIL: admin@sub2api.local
          ADMIN_PASSWORD: sub2api-pass-123
          # Upstream config validation rejects jwt.secret shorter than 32 bytes.
          JWT_SECRET: ci-e2e-sub2api-jwt-secret-0123456789abcdef0123456789abcdef012345
          TZ: "UTC"
        options: >-
          --restart on-failure
          --health-cmd "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 20s
      cliproxyapi:
        image: eceasy/cli-proxy-api:latest
        ports:
          - "3005:8317"
        env:
          PGSTORE_DSN: postgres://sub2api:sub2api-test-pw@postgres:5432/sub2api?sslmode=disable
          PGSTORE_SCHEMA: cliproxy
          PGSTORE_LOCAL_PATH: /CLIProxyAPI/pgstore
          # MANAGEMENT_PASSWORD exposes the /v0/management routes and enables
          # remote management without a config.yaml; the key below is a
          # throwaway CI value (no real secret, minted per run).
          MANAGEMENT_PASSWORD: e2e-cliproxyapi-mgmt-key
          TZ: "UTC"
        options: >-
          --restart on-failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-toolchain
      - name: Prove strict relay smoke semantics
        run: |
          set -euo pipefail
          bash -n scripts/e2e/smoke.sh
          bash -n scripts/e2e/smoke-strict-relay-test.sh
          python3 -c 'import ast; ast.parse(open("scripts/e2e/mock-openai.py", encoding="utf-8").read())'
          bash scripts/e2e/smoke-strict-relay-test.sh
          python3 -m unittest discover -s scripts/e2e -p 'test_verify_real_relay.py'
          python3 -m unittest discover -s scripts/e2e -p 'test_verify_management_matrix.py'
          python3 -m unittest discover -s scripts/e2e -p 'test_verify_management_full.py'
          node --test web/scripts/__tests__/acceptance-evidence.test.mjs
      - name: Initialize upstreams
        run: |
          set -euo pipefail
          # new-api v1 has no default password: first-run setup creates root.
          for i in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:3000/api/setup \
              -H 'Content-Type: application/json' \
              -d '{"username":"root","password":"metapi123","confirmPassword":"metapi123","SelfUseModeEnabled":false,"DemoSiteEnabled":false}' >/dev/null 2>&1; then
              echo "new-api initialized"
              break
            fi
            sleep 2
          done
          # Wire the fresh New API instance to a deterministic OpenAI mock that
          # runs on the Actions host in the next step. Service containers reach
          # the host through their Docker network gateway.
          curl -fsS -X POST http://127.0.0.1:3000/api/user/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"root","password":"metapi123"}' \
            -o new-api-login.json
          new_api_access_token="$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("success") is True; print(p["data"]["access_token"])' new-api-login.json)"
          new_api_user_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["user"]["id"])' new-api-login.json)"
          new_api_container="$(docker ps --filter publish=3000 --format '{{.ID}}' | head -n 1)"
          test -n "$new_api_container"
          new_api_network="$(docker inspect "$new_api_container" --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          runner_gateway="$(docker network inspect "$new_api_network" --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$runner_gateway"

          python3 - "$runner_gateway" > new-api-channel.json <<'PY'
          import json, sys
          print(json.dumps({
              "mode": "single",
              "channel": {
                  "type": 1,
                  "name": "metapi-e2e-mock",
                  "key": "e2e-mock-upstream-key",
                  "status": 1,
                  "base_url": f"http://{sys.argv[1]}:3002",
                  "models": "gpt-5-mini",
                  "test_model": "gpt-5-mini",
                  "group": "default",
              },
          }))
          PY
          curl -fsS -X POST http://127.0.0.1:3000/api/channel/ \
            -H "Authorization: Bearer $new_api_access_token" \
            -H "New-Api-User: $new_api_user_id" \
            -H 'Content-Type: application/json' \
            --data-binary @new-api-channel.json \
            -o new-api-channel-response.json
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("success") is True, p' new-api-channel-response.json

          cat > new-api-token.json <<'JSON'
          {"name":"metapi-e2e-relay","expired_time":-1,"remain_quota":0,"unlimited_quota":true,"model_limits_enabled":false,"model_limits":"","group":"default"}
          JSON
          curl -fsS -X POST http://127.0.0.1:3000/api/token/ \
            -H "Authorization: Bearer $new_api_access_token" \
            -H "New-Api-User: $new_api_user_id" \
            -H 'Content-Type: application/json' \
            --data-binary @new-api-token.json \
            -o new-api-token-response.json
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("success") is True, p' new-api-token-response.json
          # Do not fetch/bind the full key here. The Metapi login path must
          # discover this masked token through New API and hydrate it through
          # /api/token/batch/keys; bypassing that path would recreate #1179's
          # false-green E2E.


          # one-api auto-seeds root/123456; just wait for readiness.
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/status >/dev/null 2>&1 && { echo "one-api ready"; break; }
            sleep 2
          done

          # sub2api first-run: AUTO_SETUP=true (container env) migrates the
          # postgres DB and creates the admin from ADMIN_EMAIL/ADMIN_PASSWORD.
          # No CI secrets: the session JWT below is minted in this step by
          # logging in with that throwaway admin, so the token-import chain can
          # exercise metapi's real JWT verify path against the fresh instance.
          sub2api_ready=
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3004/health >/dev/null 2>&1; then
              sub2api_ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$sub2api_ready" ]; then
            echo "sub2api failed to become ready" >&2
            exit 1
          fi
          curl -fsS -X POST http://127.0.0.1:3004/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@sub2api.local","password":"sub2api-pass-123"}' \
            -o sub2api-login.json
          sub2api_token="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["data"]["access_token"])' sub2api-login.json)"
          echo "sub2api admin login OK"
          echo "SUB2API_ACCESS_TOKEN=$sub2api_token" >> "$GITHUB_ENV"

          # cliproxyapi first-run: the config bootstrapped from the image's
          # config.example.yaml still carries template api-keys, which triggers
          # the upstream "unsafe example API key" safe mode that disables all
          # proxy endpoints (and makes /v1/* answer 403, so it cannot serve as
          # the readiness probe). Wait on the management API instead, then
          # replace the template api-keys via PUT /v0/management/api-keys; the
          # hot reload re-enables the proxy endpoints. The management key
          # doubles as the api-key so metapi's single stored credential
          # authenticates both the /v1 and /v0/management probes.
          cpa_ready=
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3005/v0/management/api-keys               -H 'Authorization: Bearer e2e-cliproxyapi-mgmt-key' >/dev/null 2>&1; then
              cpa_ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$cpa_ready" ]; then
            echo "cliproxyapi failed to become ready" >&2
            exit 1
          fi
          curl -fsS -X PUT http://127.0.0.1:3005/v0/management/api-keys             -H 'Authorization: Bearer e2e-cliproxyapi-mgmt-key'             -H 'Content-Type: application/json'             -d '["e2e-cliproxyapi-mgmt-key"]' >/dev/null
          cpa_proxy=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3005/v1/models               -H 'Authorization: Bearer e2e-cliproxyapi-mgmt-key' >/dev/null 2>&1; then
              cpa_proxy=1
              break
            fi
            sleep 1
          done
          if [ -z "$cpa_proxy" ]; then
            echo "cliproxyapi proxy endpoints stayed disabled after api-key update" >&2
            exit 1
          fi
          echo "cliproxyapi ready (template api-keys replaced, safe mode cleared)"
      - name: Run live server + smoke chains
        run: |
          set -euo pipefail
          mock_log="$RUNNER_TEMP/mock-openai-requests.jsonl"
          mock_stdout="$RUNNER_TEMP/mock-openai.log"
          MOCK_OPENAI_HOST=0.0.0.0 \
          MOCK_OPENAI_PORT=3002 \
          MOCK_OPENAI_LOG="$mock_log" \
          MOCK_OPENAI_MODELS=gpt-5-mini \
          MOCK_OPENAI_MARKER=metapi-e2e-marker \
          python3 scripts/e2e/mock-openai.py >"$mock_stdout" 2>&1 &
          mock_pid=$!

          # Built once and started directly so $server_pid IS the server. A `go run`
          # wrapper is a different process from the child it spawns, and the restart
          # gate at the end of this step kills $server_pid and then requires the port
          # to be free; through a wrapper that premise would be ambiguous, and an
          # ambiguous restart proves nothing while still going green.
          metapi_bin="$RUNNER_TEMP/metapi-e2e-server"
          go build -o "$metapi_bin" ./cmd/server
          bash scripts/e2e/legacy-upgrade-process.sh "$metapi_bin"
          # Hoisted out of the env prefix so the restart below reuses the SAME
          # persisted data dir instead of a fresh one.
          data_dir="$(mktemp -d)/data"
          AUTH_TOKEN=e2e-admin-token \
          PROXY_TOKEN=e2e-proxy-token \
          DATA_DIR="$data_dir" \
          PORT=4010 \
          "$metapi_bin" >"$RUNNER_TEMP/metapi-e2e.log" 2>&1 &
          server_pid=$!
          cleanup() {
            exit_code=$?
            set +e
            kill "$server_pid" "$mock_pid" >/dev/null 2>&1
            wait "$server_pid" "$mock_pid" >/dev/null 2>&1
            exit "$exit_code"
          }
          trap cleanup EXIT

          mock_ready=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/health 2>/dev/null | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok"}' 2>/dev/null; then
              mock_ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$mock_ready" ]; then
            echo "mock OpenAI failed to become ready; log:"
            cat "$mock_stdout"
            exit 1
          fi
          ready=
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4010/ready 2>/dev/null | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "metapi server failed to become ready; log:"
            cat "$RUNNER_TEMP/metapi-e2e.log"
            exit 1
          fi

          echo "===== new-api full chain (three-protocol relay matrix) ====="
          # MOCK_REQUEST_LOG arms smoke.sh's per-protocol upstream-evidence
          # reconciliation (chat + messages + responses each require a NEW
          # mock event carrying the relayed model after their POST).
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3000 \
          UPSTREAM_USERNAME=root UPSTREAM_PASSWORD=metapi123 \
          PLATFORM=new-api PROXY_MODEL=gpt-5-mini EXPECT_RELAY=1 \
          EXPECTED_COMPLETION_CONTENT=metapi-e2e-marker \
          MOCK_REQUEST_LOG="$mock_log" \
          bash scripts/e2e/smoke.sh

          echo "===== one-api admin chain (relay explicitly unavailable) ====="
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3001 \
          UPSTREAM_USERNAME=root UPSTREAM_PASSWORD=123456 \
          PLATFORM=one-api EXPECT_RELAY=0 \
          SITE_NAME=e2e-smoke-oneapi TOKEN_NAME=e2e-smoke-oneapi-token \
          bash scripts/e2e/smoke.sh

          # These fixtures have no real provider configured: exercise management
          # without presenting a structured relay error as successful inference.
          echo "===== sub2api token-import chain ====="
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3004 \
          UPSTREAM_TOKEN="$SUB2API_ACCESS_TOKEN" \
          PLATFORM=sub2api CREDENTIAL_MODE=session \
          SKIP_MODEL_FETCH=true E2E_SKIP_RELAY=1 \
          SITE_NAME=e2e-smoke-sub2api TOKEN_NAME=e2e-smoke-sub2api-token \
          bash scripts/e2e/verify-token-import.sh

          echo "===== sub2api re-run against an aged STORED credential (#1209) ====="
          # The scripts promise to be re-runnable, so prove it the way the defect
          # actually appeared: age the credential that is STORED -- not the one in
          # the environment -- then re-run the same chain with the same token. A
          # script that merely skips an existing account leaves the stale value in
          # place; verify-token still passes because it uses the fresh token from
          # the environment, and the run dies on balance, two steps away from what
          # it is testing. Reverting the account step to create-or-skip turns this
          # block red, which is the only reason it is worth its runtime.
          aged_account_id="$(curl -sS -H "Authorization: Bearer e2e-admin-token" \
            http://127.0.0.1:4010/api/accounts | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for account in payload.get("accounts") or []:
              if account.get("username") == "e2e-token-import":
                  print(account["id"])
                  break
          ')"
          if [ -z "$aged_account_id" ]; then
            echo "FATAL: no e2e-token-import account to age; the chain above did not create one"
            exit 1
          fi
          # Check the probe's own premise: an aging PUT that silently failed would
          # leave a valid credential stored and the re-run below would prove
          # nothing while still going green.
          aging_status="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer e2e-admin-token" -H "Content-Type: application/json" \
            -d '{"accessToken":"aged-by-ci-not-a-real-credential","credentialMode":"session"}' \
            "http://127.0.0.1:4010/api/accounts/$aged_account_id")"
          if [ "$aging_status" != "200" ]; then
            echo "FATAL: aging the stored credential returned HTTP $aging_status"
            exit 1
          fi
          echo "aged the stored credential of account $aged_account_id"
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3004 \
          UPSTREAM_TOKEN="$SUB2API_ACCESS_TOKEN" \
          PLATFORM=sub2api CREDENTIAL_MODE=session \
          SKIP_MODEL_FETCH=true E2E_SKIP_RELAY=1 \
          SITE_NAME=e2e-smoke-sub2api TOKEN_NAME=e2e-smoke-sub2api-token \
          bash scripts/e2e/verify-token-import.sh

          echo "===== cliproxyapi token-import chain ====="
          METAPI_URL=http://127.0.0.1:4010 \
          METAPI_AUTH_TOKEN=e2e-admin-token \
          UPSTREAM_URL=http://127.0.0.1:3005 \
          UPSTREAM_TOKEN=e2e-cliproxyapi-mgmt-key \
          PLATFORM=cliproxyapi CREDENTIAL_MODE=apikey \
          SKIP_MODEL_FETCH=true E2E_SKIP_RELAY=1 \
          SITE_NAME=e2e-smoke-cliproxyapi TOKEN_NAME=e2e-smoke-cliproxyapi-token \
          bash scripts/e2e/verify-token-import.sh

          echo "===== restart metapi against the SAME data dir and re-prove the core chain ====="
          # Restart is one of the four states a release has to survive, and a fresh
          # install says nothing about it: whether persisted state actually hydrates
          # only exists as a question across a process boundary. That is not
          # hypothetical here -- settings that saved successfully and were gone after
          # a restart is a bug this project has already shipped. No unit test can
          # reproduce it, so the gate lives where a real process is killed.
          #
          # Nothing below re-logs in, re-binds an account, rebuilds a route or
          # re-creates a key. If the chain only works after re-configuration, that is
          # the defect this gate exists to catch.
          restart_probe="restart-hydration-probe-$(date +%s)"
          curl -fsS -X PUT -H "Authorization: Bearer e2e-admin-token" \
            -H "Content-Type: application/json" \
            -d "{\"about\":\"$restart_probe\"}" \
            http://127.0.0.1:4010/api/settings/runtime >/dev/null
          echo "wrote a distinctive persisted setting: $restart_probe"
          mock_events_before=$(wc -l < "$mock_log")

          kill "$server_pid"
          wait "$server_pid" || true
          # Premise check: the port must actually be free before claiming a restart.
          released=
          for i in $(seq 1 30); do
            if ! curl -sS -m 2 -o /dev/null http://127.0.0.1:4010/health 2>/dev/null; then
              released=1; echo "port 4010 free ${i}s after SIGTERM"; break
            fi
            sleep 1
          done
          if [ -z "$released" ]; then
            echo "metapi still answered 30s after SIGTERM: nothing restarted, so everything below would prove nothing"
            exit 1
          fi

          AUTH_TOKEN=e2e-admin-token \
          PROXY_TOKEN=e2e-proxy-token \
          DATA_DIR="$data_dir" \
          PORT=4010 \
          "$metapi_bin" >"$RUNNER_TEMP/metapi-e2e-restarted.log" 2>&1 &
          server_pid=$!
          restarted_ready=
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4010/ready 2>/dev/null | grep -q '"status":"ok"'; then
              restarted_ready=1; echo "restarted metapi ready after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$restarted_ready" ]; then
            echo "restarted metapi never became ready; log:"
            cat "$RUNNER_TEMP/metapi-e2e-restarted.log"
            exit 1
          fi

          about_after_restart="$(curl -fsS -H "Authorization: Bearer e2e-admin-token" \
            http://127.0.0.1:4010/api/settings/runtime \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("about",""))')"
          if [ "$about_after_restart" != "$restart_probe" ]; then
            echo "persisted setting did NOT hydrate after restart: got '$about_after_restart', want '$restart_probe'"
            exit 1
          fi
          echo "persisted setting hydrated from the same data dir"

          curl -fsS -H "Authorization: Bearer sk-e2e-smoke-key" http://127.0.0.1:4010/v1/models \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin).get("data") or []
          if not data:
              raise SystemExit("/v1/models is empty after restart: routing state did not survive the process boundary")
          print("models after restart:", [m.get("id") for m in data])
          '

          curl -fsS -X POST -H "Authorization: Bearer sk-e2e-smoke-key" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-5-mini","messages":[{"role":"user","content":"restart-state"}]}' \
            http://127.0.0.1:4010/v1/chat/completions \
            | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          choice = (payload.get("choices") or [{}])[0]
          content = (choice.get("message") or {}).get("content") or ""
          if content != "metapi-e2e-marker":
              raise SystemExit(f"completion after restart returned {content!r}, want the exact upstream marker; payload={payload!r}")
          print("completion after restart carried the exact upstream marker")
          '

          # Upstream proof, not just a good-looking body: the mock must have received
          # a NEW request after the restart. Without the count comparison, a served
          # from-cache or replayed answer would be indistinguishable from a relay.
          python3 - "$mock_log" "$mock_events_before" <<'PY'
          import json, sys
          path, before = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              events = [json.loads(line) for line in handle if line.strip()]
          expected = {"path": "/v1/chat/completions", "model": "gpt-5-mini"}
          if len(events) <= before:
              raise SystemExit(f"mock upstream saw no new request after the restart ({before} -> {len(events)})")
          if expected not in events[before:]:
              raise SystemExit(f"post-restart upstream requests did not include {expected!r}: {events[before:]!r}")
          print(f"mock upstream received a new exact relay event after restart ({before} -> {len(events)})")
          PY

          echo "===== restore the exported backup into a FRESH data dir and re-prove the chain ====="
          # Restore is the fourth state, and "the import answered 200" is not it: a
          # backup that imports cleanly but cannot serve a request afterwards is a
          # restore that only looks successful. Deleting tables has already broken
          # old backups once in this project, so the proof is a real relay on the
          # restored instance -- nothing re-created, re-bound or rebuilt by hand.
          #
          # Export and import both carry every credential in the database, so
          # both are sensitive operations and additionally require the master
          # token in
          # X-Admin-Confirm-Token; without it the answer is a 403 reauthRequired
          # body. Import is gated the same way.
          backup_file="$RUNNER_TEMP/metapi-e2e-backup.json"
          curl -fsS -H "Authorization: Bearer e2e-admin-token" \
            -H "X-Admin-Confirm-Token: e2e-admin-token" \
            http://127.0.0.1:4010/api/settings/backup/export -o "$backup_file"
          python3 - "$backup_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          tables = payload.get("tables") or {}
          if not tables:
              raise SystemExit(f"export carried no tables; top-level keys were {sorted(payload)!r}")
          required = ["sites", "accounts", "account_tokens", "token_routes", "route_channels", "downstream_api_keys"]
          missing = [name for name in required if name not in tables]
          if missing:
              raise SystemExit(f"export is missing tables the relay needs: {missing}")
          print(f"export carries {len(tables)} tables including {required}")
          PY

          restore_dir="$(mktemp -d)/data"
          AUTH_TOKEN=e2e-admin-token \
          PROXY_TOKEN=e2e-proxy-token \
          DATA_DIR="$restore_dir" \
          PORT=4011 \
          "$metapi_bin" >"$RUNNER_TEMP/metapi-e2e-restore.log" 2>&1 &
          restore_pid=$!
          restore_ready=
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4011/ready 2>/dev/null | grep -q '"status":"ok"'; then
              restore_ready=1; echo "restore instance ready after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$restore_ready" ]; then
            echo "restore instance never became ready; log:"
            cat "$RUNNER_TEMP/metapi-e2e-restore.log"
            exit 1
          fi

          # Premise: before the import this instance must not be able to serve the
          # chain, otherwise a green result below could come from an instance that
          # was never empty.
          pre_models="$(curl -sS -H "Authorization: Bearer sk-e2e-smoke-key" http://127.0.0.1:4011/v1/models \
            | python3 -c '
          import json, sys
          try:
              payload = json.loads(sys.stdin.read())
          except Exception:
              print(0); raise SystemExit
          print(len(payload.get("data") or []))
          ')"
          if [ "$pre_models" != "0" ]; then
            echo "the fresh instance already served $pre_models models before the import; the restore would prove nothing"
            exit 1
          fi
          echo "fresh instance serves no models before the import, as required"

          curl -fsS -X POST -H "Authorization: Bearer e2e-admin-token" -H "X-Admin-Confirm-Token: e2e-admin-token" -H "Content-Type: application/json" \
            --data-binary @"$backup_file" http://127.0.0.1:4011/api/settings/backup/import \
            | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          if not payload.get("success", False):
              raise SystemExit(f"backup import did not report success: {payload!r}")
          print("import ok; new downstream keys:", len(payload.get("newDownstreamApiKeys") or []),
                "ignored tables:", payload.get("ignoredTables") or [])
          '

          mock_events_before_restore=$(wc -l < "$mock_log")
          curl -fsS -H "Authorization: Bearer sk-e2e-smoke-key" http://127.0.0.1:4011/v1/models \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin).get("data") or []
          if not data:
              raise SystemExit("/v1/models is empty after restore: the routing state did not come back with the backup")
          print("models after restore:", [m.get("id") for m in data])
          '
          curl -fsS -X POST -H "Authorization: Bearer sk-e2e-smoke-key" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-5-mini","messages":[{"role":"user","content":"restore-state"}]}' \
            http://127.0.0.1:4011/v1/chat/completions \
            | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          choice = (payload.get("choices") or [{}])[0]
          content = (choice.get("message") or {}).get("content") or ""
          if content != "metapi-e2e-marker":
              raise SystemExit(f"completion after restore returned {content!r}, want the exact upstream marker; payload={payload!r}")
          print("completion after restore carried the exact upstream marker")
          '
          python3 - "$mock_log" "$mock_events_before_restore" <<'PY'
          import json, sys
          path, before = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              events = [json.loads(line) for line in handle if line.strip()]
          expected = {"path": "/v1/chat/completions", "model": "gpt-5-mini"}
          if len(events) <= before:
              raise SystemExit(f"mock upstream saw no new request after the restore ({before} -> {len(events)})")
          if expected not in events[before:]:
              raise SystemExit(f"post-restore upstream requests did not include {expected!r}: {events[before:]!r}")
          print(f"mock upstream received a new exact relay event after restore ({before} -> {len(events)})")
          PY
          kill "$restore_pid"
          wait "$restore_pid" || true
          echo "restore instance stopped; the exported backup stays in runner temp only"

  # Cross-platform runtime smoke: release binaries are cross-compiled for 5
  # targets but only linux/amd64 ever gets executed (release smoke step). This
  # job builds + boots the real binary on each shipped OS (macOS x64, Windows
  # x64, Linux x64 + arm64) against an in-memory SQLite store: --version,
  # startup, /ready + /health, and one minimal authenticated /v1 request.
  runtime-smoke-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pattern as the build job: go-toolchain sets up Go and creates the
      # web/dist placeholder so the //go:embed dist directive compiles on a
      # fresh checkout (the runtime smoke only needs the API, not the real SPA).
      - uses: ./.github/actions/go-toolchain
      - name: Build native binary
        shell: bash
        run: |
          set -euo pipefail
          # Native GOOS/GOARCH of the runner (ubuntu-24.04-arm -> linux/arm64);
          # go build appends .exe automatically on windows.
          go build -trimpath -o metapi-smoke ./cmd/server
      - name: Version + runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="./$(ls metapi-smoke*)"
          "$bin" --version
          data_dir="$RUNNER_TEMP/metapi-smoke-data-$RANDOM"
          mkdir -p "$data_dir"
          HOST=127.0.0.1 PORT=4097 DATA_DIR="$data_dir" DB_URL=:memory: \
          AUTH_TOKEN=smoke-admin-token PROXY_TOKEN=smoke-proxy-token \
          "$bin" >"$RUNNER_TEMP/metapi-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4097/ready" 2>/dev/null | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "server failed to become ready; log:"
            cat "$RUNNER_TEMP/metapi-smoke.log"
            exit 1
          fi
          curl -fsS "http://127.0.0.1:4097/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:4097/v1/models" \
            -H "Authorization: Bearer smoke-proxy-token" | grep -q '"object":"list"'
          echo "runtime smoke OK: $bin ($(uname -s)/$(uname -m))"

  # Build + smoke the image on every run (this is also a required check on PRs).
  # This required check runs even when an upstream job fails or skips, then
  # fails closed on every prerequisite result. A skipped required check counts
  # as successful in branch protection, so needs alone cannot gate a merge.
  # Broad screenshot capture and pixel baselines are on-demand UI QA, not
  # per-push prerequisites; the required a11y job retains browser smoke.
  docker-build:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - lint
      - vet
      - vulncheck
      - mod-verify
      - secret-scan
      - docs-hygiene
      - frontend
      - web-dist
      - a11y
      - test-sqlite
      - test-pg
      - build
      - test-e2e
      - runtime-smoke-matrix
    steps:
      - name: Require successful prerequisites
        env:
          NEEDS_RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          printf '%s' "$NEEDS_RESULTS" | jq -e 'length > 0 and all(.[]; . == "success")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: metapi-go:ci
          load: true
          build-args: |
            BUN_VERSION=${{ env.BUN_VERSION }}
            BUN_DIGEST=${{ env.BUN_DIGEST }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}-amd64
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}-amd64
      - name: Smoke Docker image
        run: |
          set -euo pipefail
          name=metapi-ci-smoke
          port=49040
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=ci-admin-token \
            -e PROXY_TOKEN=ci-proxy-token \
            metapi-go:ci

          ready=
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            docker logs "$name"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'

  # ---- Publish images: one native build per architecture, then one manifest ----
  # The old single-job build ran the arm64 half under emulation (about 10.5
  # minutes for the 0.25.0 release). Native runners build both halves in
  # parallel; the manifest job is the only place a user-facing tag is created.
  docker-prepare:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build]
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Resolve tags and refuse to overwrite a released version
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            plain="${version#v}"
            major="${plain%%.*}"
            rest="${plain#*.}"
            minor="${rest%%.*}"
            tags=("$version" "$plain" "${major}.${minor}" "latest")

            # A released version tag is an immutable identity. Re-running a
            # failed publication must use a new patch version, not silently
            # replace bytes that downstream deployments may have pinned.
            registry_path="${IMAGE_NAME#ghcr.io/}"
            token="$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              "https://ghcr.io/token?scope=repository:${registry_path}:pull" | jq -r '.token')"
            if [[ -z "$token" || "$token" == "null" ]]; then
              echo "::error::GHCR did not issue an anonymous pull token"
              exit 1
            fi
            for existing in "$version" "$plain"; do
              code="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors \
                -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${registry_path}/manifests/${existing}")"
              case "$code" in
                404) ;;
                200)
                  echo "::error::release image ${IMAGE_NAME}:${existing} already exists; published version tags are immutable. Bump the patch version."
                  exit 1
                  ;;
                *)
                  echo "::error::could not determine whether ${IMAGE_NAME}:${existing} exists (HTTP ${code})"
                  exit 1
                  ;;
              esac
            done
          else
            version=dev
            tags=("edge" "sha-${GITHUB_SHA:0:7}")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Image publication"
            echo
            echo "- version: \`${version}\`"
            echo "- tags: \`$(printf '%s ' "${tags[@]}")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-push:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: [docker-prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve build provenance
        id: provenance
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          # buildx requires a tag when pushing. This pointer is internal: the
          # manifest job merges the per-architecture digests, so a concurrent
          # run overwriting the tag cannot mix architectures.
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.docker-prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.provenance.outputs.build_time }}
            BUN_VERSION=${{ env.BUN_VERSION }}
            BUN_DIGEST=${{ env.BUN_DIGEST }}
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign per-architecture image
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Record per-architecture digest
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          printf '%s' "${{ steps.build.outputs.digest }}" > "${RUNNER_TEMP}/${ARCH}.txt"
          {
            echo "### ${IMAGE_NAME} ${ARCH} (${PLATFORM})"
            echo '```text'
            echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload architecture digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.txt
          if-no-files-found: error

  docker-manifest:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: [docker-prepare, docker-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download architecture digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true
      - name: Create and verify multi-arch manifests
        id: manifest
        shell: bash
        env:
          BASE_TAGS: ${{ needs.docker-prepare.outputs.tags }}
        run: |
          set -euo pipefail
          amd64="$(cat "${RUNNER_TEMP}/image-digests/amd64.txt")"
          arm64="$(cat "${RUNNER_TEMP}/image-digests/arm64.txt")"
          for value in "$amd64" "$arm64"; do
            if [[ ! "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::architecture digest is missing or malformed: ${value}"
              exit 1
            fi
          done
          digest=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            ref="${IMAGE_NAME}:${tag}"
            # Merge exactly the digests this run built; floating tag names could
            # mix architectures when two releases publish concurrently.
            docker buildx imagetools create -t "$ref" \
              "${IMAGE_NAME}@${amd64}" "${IMAGE_NAME}@${arm64}"
            inspect="$(docker buildx imagetools inspect "$ref")"
            printf '%s\n' "$inspect"
            for platform in linux/amd64 linux/arm64; do
              if ! grep -Eq "Platform:[[:space:]]+${platform}" <<< "$inspect"; then
                echo "::error::${ref} is missing ${platform}"
                exit 1
              fi
            done
            if ! grep -Eq 'Platform:[[:space:]]+unknown/unknown' <<< "$inspect"; then
              echo "::error::${ref} lost the build provenance attestation"
              exit 1
            fi
            tag_digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
            if [[ -z "$tag_digest" ]]; then
              echo "::error::could not read the manifest digest for ${ref}"
              exit 1
            fi
            if [[ -z "$digest" ]]; then digest="$tag_digest"; fi
            if [[ "$tag_digest" != "$digest" ]]; then
              echo "::error::${ref} resolved to ${tag_digest}, expected ${digest}"
              exit 1
            fi
          done <<< "$BASE_TAGS"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Multi-arch manifest"
            echo '```text'
            echo "${IMAGE_NAME}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign multi-arch manifest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.manifest.outputs.digest }}"

  # Pull with no GHCR credentials, then run the exact bytes a user receives.
  image-verify:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: [docker-prepare, docker-manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Pull anonymously and smoke the published image
        shell: bash
        env:
          BASE_TAGS: ${{ needs.docker-prepare.outputs.tags }}
          EXPECTED_VERSION: ${{ needs.docker-prepare.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.docker-manifest.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          first_tag="$(printf '%s\n' "$BASE_TAGS" | head -n 1)"
          ref="${IMAGE_NAME}:${first_tag}"
          pulled=
          for attempt in 1 2 3; do
            if docker pull "$ref"; then pulled=1; break; fi
            echo "pull attempt ${attempt} failed; retrying"
            sleep 5
          done
          if [[ -z "$pulled" ]]; then
            echo "::error::anonymous pull of ${ref} failed after 3 attempts"
            exit 1
          fi
          resolved="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$resolved" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::${ref} resolved to ${resolved}, expected ${EXPECTED_DIGEST}"
            exit 1
          fi
          actual_arch="$(docker image inspect "$ref" --format '{{.Architecture}}')"
          if [[ "$actual_arch" != "$ARCH" ]]; then
            echo "::error::${ref} pulled ${actual_arch} on the ${ARCH} runner"
            exit 1
          fi
          name="metapi-verify-${ARCH}"
          port=49041
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=verify-admin-token \
            -e PROXY_TOKEN=verify-proxy-token \
            -e ACCOUNT_CREDENTIAL_SECRET=verify-credential-secret-0123456789abcdef \
            "$ref"
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/ready" 2>/dev/null | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$ready" ]]; then
            docker logs "$name"
            exit 1
          fi
          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'
          about="$(curl -fsS -H 'Authorization: Bearer verify-admin-token' \
            "http://127.0.0.1:${port}/api/about")"
          printf '%s\n' "$about"
          printf '%s' "$about" | jq -e --arg v "$EXPECTED_VERSION" '.version == $v' >/dev/null
          echo "verified ${ref} on ${ARCH} (version ${EXPECTED_VERSION})"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: matrix.arch == 'amd64'
      - name: Verify the published signature
        if: matrix.arch == 'amd64'
        shell: bash
        env:
          BASE_TAGS: ${{ needs.docker-prepare.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "$BASE_TAGS" | head -n 1)"
          cosign verify "${IMAGE_NAME}:${first_tag}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/main.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  # ---- Release: SemVer tags only, after the image is published ----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [image-verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify release consistency (tag == package.json == CHANGELOG)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(node -p "require('./web/package.json').version")"
          if [ "$pkg_ver" != "$ver" ]; then
            echo "web/package.json version ($pkg_ver) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          if ! grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section '## [${GITHUB_REF_NAME}]'" >&2
            exit 1
          fi
          echo "release consistent: $GITHUB_REF_NAME / $pkg_ver"
      - name: Install web deps for release binaries
        run: sh ../scripts/bun-install.sh
        working-directory: web
      - name: Build frontend for release binaries
        working-directory: web
        run: bun run build:web
      - name: Build multi-platform release binaries
        run: |
          set -euo pipefail
          version_pkg="github.com/deliciousbuding/metapi-go/internal/version"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X ${version_pkg}.Version=${GITHUB_REF_NAME} -X ${version_pkg}.Commit=${GITHUB_SHA} -X ${version_pkg}.BuildTime=${build_time}"
          mkdir -p dist-bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-${os}-${arch}${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-migrate-${os}-${arch}${ext}" ./cmd/migrate
          done
          cd dist-bin
          sha256sum * > checksums.txt
          cd ..
      - name: Smoke linux-amd64 release binary
        run: |
          set -euo pipefail
          ./dist-bin/metapi-linux-amd64 --version | grep -Fx "$GITHUB_REF_NAME"
          ./dist-bin/metapi-linux-amd64 --help >/dev/null
      - name: Extract changelog section for this tag
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "no changelog section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Reject internal information in public release notes
        run: |
          set -euo pipefail
          # Public release notes are user-facing change logs, not internal work
          # reports. Ban internal governance vocabulary, test-coverage numbers
          # and generic internal path shapes. NOTE: no concrete hostnames or
          # config keys belong in this file (it is public) — specific leaks are
          # caught by the draft + human review gate instead.
          forbidden='真实上游|运行时矩阵|2/16|4/16|1/5|4/5|golden|截图管道|Playwright|vitest|审计波|并行线|0\.0\.0\.0/8|/root/|/home/|/tmp/|C:/|D:\\|Wave [0-9]|Round [0-9]'
          if grep -nE "$forbidden" release-body.md; then
            echo "release notes contain internal information (see matches above)" >&2
            exit 1
          fi
          echo "release notes hygiene: clean"
      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # install.sh must ship as a release asset so the documented
          # curl .../download/install.sh | bash flow resolves.
          cp scripts/install.sh dist-bin/install.sh
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-bin/* --clobber
            gh release edit "$tag" --notes-file release-body.md
          else
            # Draft by policy: tag push builds and uploads everything, but the
            # release stays hidden until a human reviews the notes (internal
            # information must never auto-publish) and publishes it.
            gh release create "$tag" dist-bin/* --title "$tag" --notes-file release-body.md --draft
          fi
