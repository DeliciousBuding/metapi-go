name: UI visual + UX e2e

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ui-visual.yml"
      - "docs/analysis/ui-visual-acceptance.md"
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - ".github/workflows/ui-visual.yml"
      - "docs/analysis/ui-visual-acceptance.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e:
    name: Playwright e2e + visual
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: List Playwright tests
        run: npx playwright test --list

      # TEMP baseline refresh (DENSE-1 density shift): run with update so the
      # step itself regenerates linux baselines; upload them, then revert to
      # plain `npm run test:e2e` after committing the refreshed snapshots.
      - name: Run e2e + visual suite
        run: npm run test:e2e -- --update-snapshots

      - name: Upload refreshed baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: web/e2e/visual-gallery.spec.ts-snapshots/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
