name: Release

on:
  push:
    # SemVer tags only (vX.Y.Z); v0.9.0-rc1 prereleases are intentionally excluded.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.10.0)
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          if [ -z "$tag" ]; then
            echo "no release tag provided" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this tag
        run: |
          awk -v ver="${{ steps.tag.outputs.tag }}" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "no changelog section for ${{ steps.tag.outputs.tag }}" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: release-body.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
