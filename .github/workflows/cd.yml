name: CD

on:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "Dockerfile"
      - ".github/workflows/cd.yml"
    # SemVer tags only (vX.Y.Z); anything else (vtest, v1) must not trigger a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/deliciousbuding/metapi-go

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: metapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gitleaks (full git history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 detect --redact --verbose
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify module checksums
        run: |
          go mod download
          go mod verify
      # SPA-fallback and static-asset tests exercise the real embedded dist,
      # so build the frontend before running Go tests.
      - name: Build frontend (real dist for SPA tests)
        working-directory: web
        run: bun install --frozen-lockfile && bun run build:web
      - name: Test Go packages with race detector
        run: go test ./... -count=1 -race
      - name: Test PostgreSQL integration paths
        run: |
          dsn="${PG_SCHEME}://${PG_USER}:${PG_PASSWORD}@localhost:5432/${PG_DATABASE}?sslmode=disable"
          PG_TEST_DSN="$dsn" DATABASE_URL="$dsn" go test ./... -count=1 -tags=integration -p 1 # -p 1: PG integration shares one database across packages; parallel packages race AutoMigrate/table state
        env:
          PG_SCHEME: postgres
          PG_USER: postgres
          PG_PASSWORD: test
          PG_DATABASE: metapi_test
      - name: Test and build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run knip
          bun run test
          bun run build:web

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: release-gate
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # Build once for the amd64 smoke test, then push the multi-arch manifest.
      - uses: docker/build-push-action@v6
        id: build-smoke
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=metapi-go
          cache-to: type=gha,mode=max,scope=metapi-go
          platforms: linux/amd64
          load: true
      - name: Smoke Docker image
        run: |
          set -euo pipefail
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          name=metapi-cd-smoke
          port=49041
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" \
            -p "127.0.0.1:${port}:4000" \
            -e AUTH_TOKEN=cd-admin-token \
            -e PROXY_TOKEN=cd-proxy-token \
            "$image"

          ready=
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            docker logs "$name"
            exit 1
          fi

          curl -fsS "http://127.0.0.1:${port}/health" | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:${port}/ready" | grep -q '"database":"ok"'
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=metapi-go
          cache-to: type=gha,mode=max,scope=metapi-go
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      # ---- Release (tag pushes only) ----
      # The GitHub Release is created here, after the image push succeeded,
      # so a published Release always points at a real ghcr.io tag.
      - name: Build multi-platform release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ldflags="-s -w -X github.com/deliciousbuding/metapi-go/internal/version.Version=${GITHUB_REF_NAME}"
          mkdir -p dist-bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-${os}-${arch}${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="$ldflags" -o "dist-bin/metapi-migrate-${os}-${arch}${ext}" ./cmd/migrate
          done
          cd dist-bin
          sha256sum * > checksums.txt
          cd ..

      - name: Extract changelog section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "no changelog section for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create GitHub Release with binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist-bin/* --clobber
            gh release edit "$tag" --notes-file release-body.md
          else
            gh release create "$tag" dist-bin/* --title "$tag" --notes-file release-body.md --latest
          fi
