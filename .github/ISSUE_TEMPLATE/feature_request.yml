name: 功能建议
description: 描述使用场景、期望行为和可验证的完成条件
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 [Issues](https://github.com/DeliciousBuding/metapi-go/issues?q=is%3Aissue)。围绕一个使用场景说明需求。

        截图、请求示例和附件请移除凭据、用户数据及私有地址、路径。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 说明谁在做什么，以及目前卡在哪里。
      placeholder: |
        - 使用场景：
        - 当前操作：
        - 遇到的问题：
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望行为
      description: 分点说明功能应如何工作；涉及页面或 API 时，可给出操作或输入输出示例。
      placeholder: |
        - 当……时，可以……。
        - 对于……，应显示 / 返回……。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成条件
      description: 列出能通过操作或输入输出核对的结果。
      placeholder: |
        1. 在……条件下执行……，结果为……。
        2. ……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有做法与参考（可选）
      description: 可补充已尝试的方法、替代方案、截图或相关链接。
