name: Feature request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 功能建议请说明使用场景与期望行为，方便评估优先级。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 你遇到了什么场景/痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望的行为或 UI 是什么样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否尝试过其他方式解决？
