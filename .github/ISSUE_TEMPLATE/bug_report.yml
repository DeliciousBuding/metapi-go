name: Bug report
description: 提交缺陷报告（安全问题请走 Security Advisory，不要用此模板）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢报告问题。知道多少填多少。提交前请涂抹 API key、Token、Cookie、账号/用户数据及私有域名、IP、路径；不要上传原始配置或完整请求头。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填实际运行进程/容器的 `--version` 输出；能取得时附镜像 digest 或二进制 SHA-256。源码构建附 commit 和是否有本地修改。仅 `latest` 或仓库 HEAD 不能识别运行产物；未知可注明。
      placeholder: 版本输出；镜像 tag + digest（如可取得）
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker 镜像（ghcr.io/deliciousbuding/metapi-go）
        - Release 二进制
        - docker-compose
        - 源码构建（go build）
        - 其他
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: 数据库
      options:
        - SQLite
        - PostgreSQL
        - 不确定
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: 上游类型（可选）
      description: 如 New API、Sub2API、CLIProxyAPI 或直连厂商；可附版本、协议/模型名。不涉及上游可留空，不要填私有地址或凭据。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 简述你要完成的用户任务，再写触发问题的最少步骤；涉及客户端时附名称与版本。
      placeholder: |
        1. 打开「站点」页面
        2. 点击「添加站点」
        3. 看到报错：……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 错误信息、截图或日志片段（记得涂抹凭证）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 服务端日志关键片段（无日志可留空）
      render: shell
