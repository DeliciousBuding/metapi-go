name: 缺陷报告
description: 告诉我们哪里出了问题，以及怎样复现
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先看看已有 [Issues](https://github.com/DeliciousBuding/metapi-go/issues?q=is%3Aissue)，同一个问题可以在原帖补充。下面填你已经知道的信息就好。

        截图、日志和请求示例请移除密钥、用户数据和私有地址。安全漏洞请通过[安全政策](https://github.com/DeliciousBuding/metapi-go/security/policy)中的私密入口报告。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 你当时在做什么？怎样操作会遇到这个问题？
      placeholder: |
        操作目标：

        1. 打开…… / 请求……
        2. 输入……
        3. 执行……后出现问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本希望看到什么？
      placeholder: 执行……后，应显示 / 返回……。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么，影响哪些操作？可以附截图，日志放在下方。
      placeholder: |
        - 实际结果：
        - 错误信息：
        - 发生频率 / 影响范围：
    validations:
      required: true
  - type: markdown
    attributes:
      value: '### 运行环境'
  - type: input
    id: version
    attributes:
      label: Metapi Go 版本
      description: 可从关于页面或程序的 --version 输出查看。镜像用 latest 时，请尽量补充程序版本；不确定也可以注明。
      placeholder: 例如 v0.24.0；源码构建可填 commit 和本地改动
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker（docker run）
        - Docker Compose
        - Release 二进制
        - 源码构建（go build）
        - 其他
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: 数据库
      options:
        - SQLite
        - PostgreSQL
        - 不确定
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 相关环境（可选）
      description: 填写与这次问题有关的信息即可。
      placeholder: |
        - 操作系统与 CPU 架构：
        - 浏览器 / 客户端名称和版本：
  - type: textarea
    id: relay
    attributes:
      label: 请求信息（转发问题选填）
      description: 接口、模型和上游类型有助于定位。如果试过直连上游，也请附上结果，方便对比。请求示例请先移除密钥和私人内容。
      placeholder: |
        - 请求接口、模型和上游类型：
        - 通过 Metapi 的状态码或错误：
        - 直连上游的结果（若已测试）：
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 相关的几行服务端或客户端日志即可。请移除凭据、用户数据和私有路径，保留错误码与错误信息。
      render: text
