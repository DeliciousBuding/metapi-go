<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MetAPI">
  <defs>
    <linearGradient id="metapi-favicon-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.55" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Favicon: real π glyph (U+03C0) from the system serif font, gradient fill. -->
  <text x="32" y="46" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
        font-size="40" font-style="italic"
        fill="url(#metapi-favicon-gradient)">π</text>
</svg>
