<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MetAPI">
  <defs>
    <linearGradient id="metapi-brand-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.55" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square brand badge, transparent background. The pi glyph is a
       real π character (U+03C0) rendered with a serif fallback stack — the
       glyph comes from the system font, not from hand-drawn strokes. -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#metapi-brand-gradient)"/>
  <text x="128" y="182" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Noto Serif', serif"
        font-size="148" font-style="italic" fill="#ffffff">π</text>
</svg>
