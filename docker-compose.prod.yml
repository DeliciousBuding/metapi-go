# Production Docker Compose
# Uses pre-built GHCR image instead of local build.
#
# Usage:
#   1. Create a .env file with required values:
#        AUTH_TOKEN=<your-admin-token>
#        PROXY_TOKEN=<your-proxy-token>
#   2. Start: docker compose -f docker-compose.prod.yml up -d
#   3. Place nginx/Caddy reverse proxy in front of 127.0.0.1:4000

services:
  metapi:
    image: ghcr.io/deliciousbuding/metapi-go:latest
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      # Required (validated at startup -- missing = exit with error)
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      PROXY_TOKEN: ${PROXY_TOKEN:?PROXY_TOKEN is required}
      # Optional with defaults
      HOST: 0.0.0.0
      CHECKIN_CRON: ${CHECKIN_CRON:-0 8 * * *}
      BALANCE_REFRESH_CRON: ${BALANCE_REFRESH_CRON:-0 * * * *}
      PORT: ${PORT:-4000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      # Database config (for PG mode; leave empty for SQLite)
      DATABASE_URL: ${DATABASE_URL:-}
      DB_PROFILE: ${DB_PROFILE:-normal}
      # Leave empty to use profile defaults (normal=10/3). Large exclusive PG: dedicated or raise explicitly.
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}
      DB_CONN_MAX_LIFETIME_SEC: ${DB_CONN_MAX_LIFETIME_SEC:-1800}
      DB_CONN_MAX_IDLE_TIME_SEC: ${DB_CONN_MAX_IDLE_TIME_SEC:-300}
      # Configurable settings (uncomment to override defaults):
      # LDOH_BASE_URL: https://ldoh.105117.xyz
      # LDOH_PROXY_TIMEOUT_SEC: "30"
      # PROXY_RATE_LIMIT_RPM: "60"
      # PROXY_LOG_ASYNC: "true"
      # PROXY_LOG_BATCH_SIZE: "50"
      # PROXY_LOG_FLUSH_INTERVAL_MS: "1000"
      # REQUEST_BODY_LIMIT_MB: "20"
      # FILE_UPLOAD_LIMIT_MB: "100"
      # ADMIN_RATE_LIMIT_RPS: "100"
      # ADMIN_RATE_LIMIT_BURST: "200"
      # OAUTH_RATE_LIMIT_RPS: "10"
      # OAUTH_RATE_LIMIT_BURST: "20"
      # PROXY_MAX_STREAM_RESPONSE_BYTES: "10485760"
      # PROXY_MAX_BUFFERED_RESPONSE_BYTES: "20971520"
      # LOG_LEVEL: info
    restart: unless-stopped
    # Runtime hardening (matches docker-compose.yml): drop caps, read-only root,
    # tmpfs /tmp, and bounded CPU/memory so a runaway process cannot exhaust the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "/usr/local/bin/metapi", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
